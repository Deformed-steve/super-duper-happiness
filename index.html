<html>
<body>
    <script src="https://cdn.jsdelivr.net/gh/Deformed-steve/super-duper-happiness@main/sigma.js"></script>
    <script>
        // get ?prompt= from URL
        const params = new URLSearchParams(window.location.search);
        const prompt = params.get("prompt") || "Hello!";

        puter.ai.chat(prompt, { model: "gpt-5-nano" })
            .then(response => {
                // create a JSON object with the AI text
                const output = { text: response };
                // replace body content with JSON string
                document.body.innerText = JSON.stringify(output);
            })
            .catch(err => {
                const output = { error: err.toString() };
                document.body.innerText = JSON.stringify(output);
            });
    </script>
</body>
</html>
